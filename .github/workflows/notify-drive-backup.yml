name: Notify Google Drive backup
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Request a backup of this repository
        env:
          GH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
          SOURCE: ${{ github.event.repository.name }}
        run: |
          gh api --method POST repos/noaul/github-drive-backup/actions/workflows/sync-drive.yml/dispatches -f ref=main -f "inputs[source]=$SOURCE"
